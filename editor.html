 marker.on('dragend',()=>{const p=marker.getLatLng();routes[n][i]=[p.lat,p.lng];save();draw();});
 });
 $('del').disabled=selected===null;$('undo').disabled=!history.length;
 $('add').classList.toggle('active',adding);$('add').textContent='Add positions: '+(adding?'on':'off');
 $('help').textContent='Lateral '+n+' · '+routes[n].length+' positions. '+(adding?'Tap the map to add the next position. ':'Drag markers to move positions. ')+'Yellow circles = selected lateral (17 m radius). Grey = other edited lateral. Green = lateral 7 (16 m radius). Blue dashed line = fence-down route. Position 1 is the first stop; add the rest in movement order.';
}
function fit(){const n=num(),e=original.sourceLayout.equipment.find(e=>e.num===n);map.fitBounds(L.latLngBounds([[e.lat,e.lng],...original.routes[n],...routes[n],...original.routes[7]]).pad(.25),{maxZoom:19});}
map.on('click',ev=>{if(!adding)return;snapshot();routes[num()].push([ev.latlng.lat,ev.latlng.lng]);selected=routes[num()].length-1;save();draw();});
$('unit').onchange=()=>{selected=null;adding=false;draw();fit();};
$('add').onclick=()=>{adding=!adding;draw();};
$('fit').onclick=fit;
$('undo').onclick=()=>{if(!history.length)return;routes=history.pop();selected=null;save();draw();};
$('del').onclick=()=>{if(selected===null)return;snapshot();routes[num()].splice(selected,1);selected=null;save();draw();};
$('clear').onclick=()=>{if(!routes[num()].length)return;if(!confirm('Clear every position on lateral '+num()+'? You can undo this.'))return;snapshot();routes[num()]=[];selected=null;save();draw();};
$('export').onclick=()=>{
 if(!routes[5].length||!routes[6].length){status('Both laterals need at least one position before exporting.');return;}
 const output={...structuredClone(original),portableFenceRoutes:structuredClone(routes),exportedAt:new Date().toISOString()};
 try{localStorage.setItem('irrigation-fence-up-routes-v1',JSON.stringify(routes));}catch(e){}
 const url=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='irrigation-fence-up-5-6.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('Export downloaded. Import this file in the main app, or send it to Maple.');
};
draw();fit();status('Mark the fence-up positions for 5 and 6. Existing fence-down routes stay saved. Drafts save on this device.');
