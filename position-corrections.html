<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const { initial, targets, paddocks } = JSON.parse(document.getElementById('data').textContent);
const storageKey = 'irrigation-position-corrections-v1';
const $ = id => document.getElementById(id);
let draft = structuredClone(initial);
let history = [];
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (saved?.base === JSON.stringify(initial)) draft = saved.draft;
} catch {}
const map = L.map('map', { maxZoom: 22 }).setView(initial.hydrants[12], 19);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:22,attribution:'Imagery © Esri and contributors'}).addTo(map);
const layer = L.layerGroup().addTo(map);
for(const pad of paddocks)L.polygon(pad.points,{color:'#ffe3a5',weight:1,fillOpacity:0,interactive:false}).addTo(map);
function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify({ base: JSON.stringify(initial), draft }));
    $('status').textContent = 'Draft saved on this device. Export when finished.';
  } catch {
    $('status').textContent = 'Export your edits before leaving this page.';
  }
}
function draw(fit = false) {
  const [label, group, number] = targets[$('unit').value];
  const isRoute = group === 'routes';
  const points = isRoute ? draft.routes[number] : [draft.hydrants[number]];
  layer.clearLayers();
  if (isRoute) L.polyline(points, { color: '#ffe28c', interactive: false }).addTo(layer);
  points.forEach((point, index) => {
    const text = isRoute ? index + 1 : 'H' + number;
    const marker = L.marker(point, {
      draggable: true, title: isRoute ? label + ', position ' + text : label,
      icon: L.divIcon({ className: '', html: '<div class="pin">' + text + '</div>',
        iconSize: [34, 34], iconAnchor: [17, 17] })
    }).addTo(layer);
    marker.on('dragstart', () => history.push(structuredClone(draft)));
    marker.on('dragend', () => {
      const { lat, lng } = marker.getLatLng();
      if (isRoute) draft.routes[number][index] = [lat, lng];
      else draft.hydrants[number] = [lat, lng];
      save();
      draw();
    });
  });
  $('undo').disabled = !history.length;
  if (fit) map.fitBounds(L.latLngBounds(points), { padding: [32, 32], maxZoom: 19 });
}
$('unit').onchange = () => draw(true);
$('undo').onclick = () => {
  if (!history.length) return;
  draft = history.pop();
  save();
  draw();
};
$('export').onclick = () => {
  const output = { hydrants: {}, routes: {} };
  for (const [, group, number] of targets) {
    if (JSON.stringify(draft[group][number]) !== JSON.stringify(initial[group][number])) {
      output[group][number] = draft[group][number];
    }
  }
  if (!Object.keys(output.hydrants).length && !Object.keys(output.routes).length) {
    $('status').textContent = 'Move at least one marker before exporting.';
    return;
  }
  const url = URL.createObjectURL(new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'irrigation-position-corrections.json';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  $('status').textContent = 'Export started. Send the JSON file back to apply the changes.';
};
draw(true);
</script></html>
